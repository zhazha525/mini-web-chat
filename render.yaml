# Render 部署配置（免费版）
# 用法：把本文件夹推到 GitHub 仓库，在 Render 关联仓库即可一键部署。
# 文档：https://render.com/docs/web-services
services:
  - type: web
    name: mini-web-chat
    runtime: node
    plan: free               # 免费版：固定地址、15 分钟无访问后休眠（消息已文件持久化，唤醒后历史还在）
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ROOM_KEY        # 设了之后，访问需带 ?key=你的密码；留空则不校验
        sync: false          # 部署时 Render 会让你填写这个值（也可不填）
      - key: ADMIN_PASS      # 管理后台密码；设了才能进 /admin，建议必填
        sync: false
